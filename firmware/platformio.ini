[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = platformio/espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions/tongdou_n4r2_wake.csv
board_build.app_partition_name = app0
custom_firmware_version = 0.1.1
board_upload.offset_address = 0x1D0000
build_src_filter =
  +<*>
  -<recovery/>
extra_scripts =
  pre:tools/firmware_version.py
  pre:tools/esp_sr_build.py
  tools/esp_sr_link.py
board_build.embed_files =
  assets/audio_cues/system/error.ogg
  assets/audio_cues/system/low_battery.ogg
  assets/audio_cues/system/success.ogg
  assets/audio_cues/system/vibration.ogg
  assets/audio_cues/system/wake.ogg
board_upload.flash_size = 4MB
build_flags =
  -DBOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_LOOP_STACK_SIZE=32768
  -D CONFIG_SR_MN_CN_MULTINET4_5_SINGLE_RECOGNITION_QUANT8=1
  -Wall
  -Wextra
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  links2004/WebSockets@^2.6.1
  sh123/esp32_opus@^1.0.3

[env:esp32s3_factory]
extends = env:esp32s3
extra_scripts =
  pre:tools/firmware_version.py
  pre:tools/esp_sr_build.py
  pre:tools/factory_locale_build.py
  pre:tools/factory_recovery_build.py
  tools/esp_sr_link.py
custom_factory_locale = en-GB
custom_locale_resource_version = 2

[env:esp32s3_recovery]
platform = platformio/espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions/tongdou_n4r2_wake.csv
board_build.app_partition_name = recovery
board_upload.offset_address = 0x100000
board_upload.flash_size = 4MB
build_src_filter =
  -<*>
  +<recovery/>
build_flags =
  -DBOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -Wall
  -Wextra
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
