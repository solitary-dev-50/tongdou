<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TongDou Public Showcase</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f2ea;
        --text: #171717;
        --muted: #5f5a52;
        --line: #d8cbb8;
        --accent: #a04b2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        padding: 28px 0 18px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 72px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 720px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.55;
      }

      .stage {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0;
        display: grid;
        align-content: center;
      }

      video {
        display: block;
        width: 100%;
        max-height: min(68vh, 720px);
        background: #101010;
        border: 1px solid var(--line);
      }

      .meta {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        color: var(--muted);
        font-size: 14px;
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      footer {
        padding: 18px 0 28px;
        border-top: 1px solid var(--line);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151310;
          --text: #f2eadf;
          --muted: #c7b8a5;
          --line: #3a3027;
          --accent: #f0a36f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>TongDou</h1>
        <p>A real desktop robot, physically built and running. This public repository shows TongDou step by step without releasing manufacturing-ready files yet.</p>
      </header>

      <section class="stage" aria-label="TongDou demo video">
        <video autoplay muted loop playsinline controls preload="metadata">
          <source src="media/videos/tongdou-demo-devil-descends.mp4" type="video/mp4">
          Your browser does not support this video. Open media/videos/tongdou-demo-devil-descends.mp4 instead.
        </video>
        <div class="meta">
          <span>Demo video: TongDou demo - Devil Descends</span>
          <a href="media/videos/tongdou-demo-devil-descends.mp4">Open video file</a>
        </div>
      </section>

      <footer>
        <span>Official website: <a href="https://gettongdou.com">gettongdou.com</a></span>
      </footer>
    </main>
  </body>
</html>
